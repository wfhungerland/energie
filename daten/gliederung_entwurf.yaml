       lesehilfe: "Jede Karte zeigt alle 400 Kreise. Je dunkler, desto mehr. Mit den Pfeilen oder durch Wischen geht es zur nächsten Karte. Ein Kreis lässt sich oben suchen oder in der Karte antippen.",
