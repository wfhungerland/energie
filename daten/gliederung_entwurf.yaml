# Entwurf für gliederung.yaml im Monitor, Teil „Leben vor Ort“, neues Kapitel „Energie“.
# Verweise: im Teil Energie auf diesen Abschnitt („Wo steht die Leistung?“), hier zurück auf STROM und auf den EU-Vergleich.
- name: Energie
  name_en: Energy
  abschnitte:
    - {handle: "ENERGIEWENDE", kurz: "Energiewende", kurz_en: "Energy transition",
       titel: "Wo stehen Windräder und Solaranlagen, wo fahren Elektroautos?",
       titel_en: "Where are wind turbines and solar panels, where do electric cars drive?",
       vorort: {"typ": "karten", "reihen": ["wind_sonne_kw_ew", "wind_kw_ew", "sonne_kw_ew", "eauto_anteil", "ladepunkte_10t_ew", "eautos_je_ladepunkt"],
                "namen": ["Wind und Sonne", "Wind", "Sonne", "Elektroautos", "Ladepunkte", "E-Autos je Ladepunkt"],
                "namen_en": ["Wind and solar", "Wind", "Solar", "Electric cars", "Charging points", "Electric cars per charging point"],
                "worte": ["Mehr", "Weniger"], "worte_en": ["More", "Less"]},
       lesehilfe: "Jede Karte zeigt alle 400 Kreise. Je dunkler, desto mehr. Mit den Pfeilen oder durch Wischen geht es zur nächsten Karte. Ein Kreis lässt sich oben suchen oder in der Karte antippen.",
       lesehilfe_en: "Each map shows all 400 districts. The darker, the more. The arrows, or swiping, lead to the next map. A district can be searched for above or tapped on the map.",
       einfach: "Die Karten zeigen, wie viel Leistung aus Wind und Sonne je Einwohner in einem Kreis steht und wie viele Elektroautos dort fahren. Im Norden und Osten stehen viele Windräder auf wenig Menschen. Elektroautos fahren vor allem im Westen und Süden, am meisten in Wolfsburg und Ingolstadt, wo VW und Audi sitzen.",
       einfach_en: "The maps show how much wind and solar capacity per inhabitant a district has and how many electric cars are driven there. In the north and east many wind turbines stand among few people. Electric cars are driven mainly in the west and south, most of all in Wolfsburg and Ingolstadt, home of VW and Audi.",
       details: "Leistung: Bruttoleistung aller Einheiten im Marktstammdatenregister am Jahresende 2025, je Einwohner am 31.12.2025; Wind auf See fehlt, weil diese Anlagen keinem Kreis gehören. Elektroautos: reine Batterieautos am 1.1.2026 nach dem Kraftfahrt-Bundesamt; Firmenwagen zählen am Sitz des Halters. Ladepunkte: öffentlich zugängliche Ladepunkte in Betrieb im Ladesäulenregister, nur Betreiber mit abgeschlossener Anzeige.",
       details_en: "Capacity: gross capacity of all units in the core energy market data register at the end of 2025, per inhabitant on 31 December 2025; offshore wind is missing because these plants belong to no district. Electric cars: battery electric cars on 1 January 2026 according to the Federal Motor Transport Authority; company cars count where the keeper is registered. Charging points: publicly accessible charging points in operation in the charging register, only operators with a completed notification."}

# Baustein 2: Teil Wachstum, Kapitel Welt. Verweis aus dem Teil Energie und aus ENERGIEWENDE.
- {handle: "ERNEUERBARE_EU", kurz: "Erneuerbare EU", kurz_en: "Renewables EU",
   titel: "Wie viel Energie kommt in den EU-Staaten aus erneuerbaren Quellen?",
   titel_en: "How much energy comes from renewable sources in EU countries?",
   ansichten: ["Insgesamt", "Strom", "Wärme und Kälte", "Verkehr"], ansichten_en: ["Total", "Electricity", "Heating and cooling", "Transport"],
   einfach: "Die Balken zeigen, wie viel der Energie in jedem EU-Land aus Wind, Sonne, Wasser und Biomasse kommt. Beim Strom liegt Deutschland über dem Schnitt der EU, beim Heizen weit darunter. Bis 2030 will die EU insgesamt mindestens 42,5 % erreichen.",
   einfach_en: "The bars show how much of the energy in each EU country comes from wind, sun, water and biomass. In electricity Germany is above the EU average, in heating far below. By 2030 the EU wants to reach at least 42.5% overall.",
   details: "Anteil am Bruttoendenergieverbrauch nach den Rechenregeln der Erneuerbare-Energien-Richtlinie (Eurostat SHARES). Im Verkehr zählen Strom aus erneuerbaren Quellen und fortschrittliche Biokraftstoffe mehrfach; der Anteil liegt daher über dem physischen. Das Ziel von 42,5 % für 2030 steht in der Richtlinie (EU) 2023/2413.",
   details_en: "Share of gross final energy consumption under the accounting rules of the Renewable Energy Directive (Eurostat SHARES). In transport, renewable electricity and advanced biofuels count several times, so the share is above the physical one. The 42.5% target for 2030 is set in Directive (EU) 2023/2413."}
